<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulados Êxito — 4º Ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --roxo:#7c4dff; --roxo-esc:#5e35b1; --amarelo:#ffb300;
    --verde:#43a047; --vermelho:#e53935; --azul:#1e88e5;
  }
  *{box-sizing:border-box;font-family:'Baloo 2','Segoe UI',sans-serif}
  body{margin:0;background:linear-gradient(135deg,#e3f0ff,#f5e9ff);min-height:100vh}
  .container{max-width:640px;margin:0 auto;padding:16px}
  h1{color:var(--roxo-esc);text-align:center;margin:12px 0}
  h2{color:var(--roxo-esc);margin-top:0}
  .card{background:#fff;border-radius:24px;padding:22px;margin:14px 0;
    box-shadow:0 6px 20px rgba(124,77,255,.15)}
  .btn{border:none;border-radius:16px;padding:14px 20px;font-size:17px;
    font-weight:bold;color:#fff;cursor:pointer;width:100%;margin:6px 0;
    transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-roxo{background:var(--roxo)}
  .btn-verde{background:var(--verde)}
  .btn-amarelo{background:var(--amarelo)}
  .btn-azul{background:var(--azul)}
  select{width:100%;padding:14px;border-radius:16px;font-size:17px;
    border:2px solid var(--roxo);color:var(--roxo-esc);background:#fff;margin:8px 0}
  .progress{background:#eee;border-radius:20px;height:16px;overflow:hidden;margin:10px 0}
  #barraProg{background:linear-gradient(90deg,var(--roxo),var(--amarelo));
    height:100%;transition:width .3s}
  .opcao{display:block;width:100%;text-align:left;background:#f4f7fb;
    border:2px solid #dfe6ef;border-radius:16px;padding:14px;margin:8px 0;
    font-size:16px;cursor:pointer;transition:.15s}
  .opcao:hover{border-color:var(--roxo)}
  .opcao.sel{background:#ede4ff;border-color:var(--roxo)}
  .opcao.certa{background:#e3f7e6;border-color:var(--verde)}
  .opcao.errada{background:#ffe5e5;border-color:var(--vermelho)}
  .letra{display:inline-block;width:28px;height:28px;line-height:28px;
    text-align:center;background:var(--roxo);color:#fff;border-radius:50%;
    margin-right:10px;font-weight:bold}
  .feedback{background:#fff8e1;border-left:5px solid var(--amarelo);
    border-radius:10px;padding:10px;margin-top:8px;font-size:14px;color:#6d4c00}
  #estrelas{font-size:52px;text-align:center;margin:10px 0}
  .hist-item{display:flex;justify-content:space-between;background:#f4f7fb;
    border-radius:12px;padding:10px;margin:6px 0;font-size:14px}
  .medalha{display:flex;align-items:center;gap:14px;background:#f4f7fb;
    border-radius:16px;padding:14px;margin:10px 0}
  .medalha .icone{font-size:44px}
  .medalha .info{flex:1}
  .medalha .info h3{margin:0}
  .medalha .info small{color:#777}
  .bloqueada{opacity:.45;filter:grayscale(1)}
  .hide{display:none}
  small{color:#777}
  .ilustra{text-align:center;font-size:34px;line-height:1.4;margin:10px 0;
    background:#f4f7fb;border-radius:16px;padding:14px}
  .ilustra table{margin:0 auto;border-collapse:collapse;font-size:16px}
  .ilustra td,.ilustra th{border:2px solid var(--roxo);padding:8px 14px}
  .ilustra th{background:#ede4ff;color:var(--roxo-esc)}
  .forma{display:inline-block;margin:4px}
  .quadrado{width:60px;height:60px;background:var(--azul);border-radius:6px}
  .triangulo{width:0;height:0;border-left:34px solid transparent;
    border-right:34px solid transparent;border-bottom:60px solid var(--verde)}
  .circulo{width:60px;height:60px;background:var(--amarelo);border-radius:50%}
  .retangulo{width:90px;height:50px;background:var(--vermelho);border-radius:6px}
</style>
</head>
<body>
<div class="container">

  <h1>🎓 Simulados Divertidos</h1>

  <!-- TELA INICIAL -->
  <div id="telaInicio">
    <div class="card">
      <h2>Vamos estudar? 🚀</h2>
      <p>Escolha uma matéria e teste seus conhecimentos!</p>
      <select id="selMateria">
        <option value="Ciencias">🔬 Ciências</option>
        <option value="EducacaoFisica">⚽ Educação Física</option>
        <option value="Geografia">🗺️ Geografia</option>
        <option value="Historia">📜 História</option>
        <option value="Ingles">🇬🇧 Língua Inglesa</option>
        <option value="Portugues">📖 Língua Portuguesa</option>
        <option value="Matematica">🔢 Matemática</option>
      </select>
      <button class="btn btn-verde" onclick="comecarProva()">▶️ Começar Simulado</button>
      <button class="btn btn-azul" onclick="verHistorico()">📊 Meu Histórico</button>
      <button class="btn btn-amarelo" onclick="verMedalhas()">🏅 Minhas Medalhas</button>
    </div>
  </div>

  <!-- TELA PROVA -->
  <div id="telaProva" class="hide">
    <div class="card">
      <h2 id="tituloProva"></h2>
      <div class="progress"><div id="barraProg" style="width:0%"></div></div>
      <p style="display:flex;justify-content:space-between;align-items:center">
        <small id="contador"></small>
        <span id="cronometro" style="font-weight:bold;color:var(--roxo);font-size:18px">⏱️ 00:00</span>
      </p>
    </div>
    <div id="questoes"></div>
    <button class="btn btn-roxo" onclick="enviarProva()">✅ Enviar Respostas</button>
    <button class="btn btn-amarelo" onclick="voltarInicio()">🏠 Início</button>
  </div>

  <!-- TELA RESULTADO -->
  <div id="telaResultado" class="hide">
    <div class="card">
      <div id="estrelas"></div>
      <h2 id="msgNota" style="text-align:center"></h2>
      <p id="detalheNota" style="text-align:center;font-size:15px"></p>
      <button class="btn btn-azul" onclick="verGabarito()">🔍 Ver Gabarito Comentado</button>
      <button class="btn btn-verde" onclick="refazerProva()">🔁 Refazer</button>
      <button class="btn btn-amarelo" onclick="voltarInicio()">🏠 Início</button>
    </div>
  </div>

  <!-- TELA HISTÓRICO -->
  <div id="telaHistorico" class="hide">
    <div class="card">
      <h2>📊 Meu Histórico</h2>
      <div id="listaHistorico"></div>
      <button class="btn btn-vermelho" style="background:var(--vermelho)" onclick="limparHistorico()">🗑️ Limpar Histórico</button>
      <button class="btn btn-amarelo" onclick="voltarInicio()">🏠 Início</button>
    </div>
  </div>

  <!-- TELA MEDALHAS -->
  <div id="telaMedalhas" class="hide">
    <div class="card">
      <h2>🏅 Minhas Medalhas</h2>
      <div id="listaMedalhas"></div>
      <br>
      <button class="btn btn-amarelo" onclick="voltarInicio()">🏠 Início</button>
    </div>
  </div>

</div>

<script>
/* ===================== BANCO DE QUESTÕES ===================== */
const BANCO = {
  Historia: [
    {id:1, conteudo_bncc:"A ação dos seres humanos no tempo",
     pergunta:"Por que estudamos a História?",
     opcoes:{A:"Para entender como as pessoas viviam no passado e as mudanças ao longo do tempo.",B:"Para decorar datas sem sentido.",C:"Porque não serve para nada.",D:"Só para saber a hora."},
     correta:"A", feedback:"A História estuda a ação dos seres humanos no tempo, ajudando a entender o passado e as mudanças até hoje."},
    {id:2, conteudo_bncc:"O início da vida humana na África",
     pergunta:"Segundo os estudos, em qual continente surgiram os primeiros seres humanos?",
     opcoes:{A:"Na Europa.",B:"Na África.",C:"na América.",D:"Na Antártida."},
     correta:"B", feedback:"Os estudos indicam que os primeiros seres humanos surgiram na África, há milhares de anos."},
    {id:3, conteudo_bncc:"Os primeiros grupos humanos",
     pergunta:"Como viviam os primeiros grupos humanos, antes de aprenderem a plantar?",
     opcoes:{A:"Em grandes cidades.",B:"Da caça de animais e da coleta de frutas e raízes.",C:"Comprando comida em mercados.",D:"Criando gado em fazendas."},
     correta:"B", feedback:"Os primeiros grupos eram caçadores e coletores: caçavam animais e coletavam frutas, raízes e sementes."},
    {id:4, conteudo_bncc:"Como viviam os primeiros grupos humanos",
     pergunta:"Por que os primeiros grupos humanos eram nômades (mudavam de lugar)?",
     opcoes:{A:"Porque gostavam de viajar.",B:"Para procurar alimento e água.",C:"Porque tinham carros.",D:"Para ir à escola."},
     correta:"B", feedback:"Eles eram nômades: mudavam de lugar em busca de alimento, água e melhores condições de vida."},
    {id:5, conteudo_bncc:"Como viviam os primeiros grupos humanos",
     pergunta:"O que os primeiros grupos humanos usavam para fabricar suas ferramentas?",
     opcoes:{A:"Plástico.",B:"Pedras, ossos e madeira.",C:"Metal e vidro.",D:"Papel."},
     correta:"B", feedback:"Eles fabricavam ferramentas com pedras, ossos e madeira para caçar, cortar e se defender."},
    {id:6, conteudo_bncc:"A domesticação do fogo",
     pergunta:"O domínio do fogo trouxe qual vantagem para os primeiros humanos?",
     opcoes:{A:"Nenhuma vantagem.",B:"Aquecer-se, cozinhar alimentos e afastar animais.",C:"Deixou tudo pior.",D:"Fez com que parassem de comer."},
     correta:"B", feedback:"Com o fogo, eles podiam se aquecer, cozinhar alimentos, iluminar a noite e se proteger de animais."},
    {id:7, conteudo_bncc:"A domesticação do fogo",
     pergunta:"O que significa dizer que os humanos aprenderam a DOMINAR o fogo?",
     opcoes:{A:"Que aprenderam a produzir e controlar o fogo.",B:"Que tinham medo do fogo.",C:"Que apagaram todo o fogo do mundo.",D:"Que nunca usaram o fogo."},
     correta:"A", feedback:"Dominar o fogo significa aprender a produzi-lo e controlá-lo, usando-o a favor da vida em grupo."},
    {id:8, conteudo_bncc:"Os primeiros grupos humanos",
     pergunta:"As pinturas feitas pelos primeiros humanos nas paredes das cavernas são chamadas de:",
     opcoes:{A:"Fotografias.",B:"Pinturas rupestres.",C:"Cartazes.",D:"Placas."},
     correta:"B", feedback:"As pinturas rupestres eram feitas nas rochas e cavernas e mostram como aqueles grupos viviam."},
    {id:9, conteudo_bncc:"Caminhada pelo mundo afora",
     pergunta:"Como os seres humanos ocuparam os diferentes continentes do planeta?",
     opcoes:{A:"Migrando (caminhando) da África para outras regiões ao longo de muito tempo.",B:"Nascendo em todos os lugares ao mesmo tempo.",C:"Viajando de avião.",D:"Ficando sempre no mesmo lugar."},
     correta:"A", feedback:"Os humanos partiram da África e, ao longo de milhares de anos, migraram e povoaram os outros continentes."},
    {id:10, conteudo_bncc:"Os primeiros habitantes do território brasileiro",
     pergunta:"Quem foram os primeiros habitantes do território que hoje é o Brasil?",
     opcoes:{A:"Os portugueses.",B:"Os povos indígenas.",C:"Os africanos.",D:"Os europeus."},
     correta:"B", feedback:"Os povos indígenas foram os primeiros habitantes do território brasileiro, muito antes da chegada dos europeus."},
    {id:11, conteudo_bncc:"Os primeiros habitantes do território brasileiro",
     pergunta:"Como os povos indígenas conseguiam seu alimento antes de 1500?",
     opcoes:{A:"Da caça, pesca, coleta e do plantio.",B:"Em supermercados.",C:"Comprando de navios.",D:"Em fábricas."},
     correta:"A", feedback:"Os indígenas viviam da caça, da pesca, da coleta de frutas e também do plantio de alimentos como a mandioca."},
    {id:12, conteudo_bncc:"Plantar transformou a vida humana",
     pergunta:"O que mudou na vida dos humanos quando eles descobriram a agricultura?",
     opcoes:{A:"Passaram a viajar mais.",B:"Passaram a plantar e deixaram de depender só da caça.",C:"Pararam de comer.",D:"Voltaram a viver em cavernas."},
     correta:"B", feedback:"Com a agricultura, os humanos passaram a plantar seu próprio alimento, sem depender apenas da caça e da coleta."},
    {id:13, conteudo_bncc:"Novos modos de vida",
     pergunta:"O que significa dizer que os humanos se tornaram SEDENTÁRIOS?",
     opcoes:{A:"Que passaram a viver fixos em um mesmo lugar.",B:"Que mudavam de lugar todo dia.",C:"Que pararam de trabalhar.",D:"Que viviam dentro da água."},
     correta:"A", feedback:"Sedentário é quem vive fixo em um lugar. Com a agricultura, os humanos se fixaram perto das plantações."},
    {id:14, conteudo_bncc:"Novos modos de vida",
     pergunta:"Além de plantar, o que mais os humanos aprenderam a fazer para ter alimento?",
     opcoes:{A:"A domesticar (criar) animais.",B:"A construir prédios.",C:"A fabricar carros.",D:"A usar computadores."},
     correta:"A", feedback:"Eles aprenderam a domesticar animais, criando-os para ter carne, leite, lã e ajuda no trabalho."},
    {id:15, conteudo_bncc:"Novos modos de vida",
     pergunta:"Com o início da agricultura, os grupos humanos começaram a formar:",
     opcoes:{A:"Aldeias e, depois, as primeiras cidades.",B:"Aviões.",C:"Escolas modernas.",D:"Fábricas de brinquedos."},
     correta:"A", feedback:"Ao se fixarem, os humanos formaram aldeias que cresceram e deram origem às primeiras cidades."},
    {id:16, conteudo_bncc:"A importância dos rios",
     pergunta:"Por que os primeiros povos costumavam se instalar perto dos rios?",
     opcoes:{A:"Porque os rios davam água, alimento e terras boas para plantar.",B:"Porque os rios eram perigosos.",C:"Porque não gostavam de água.",D:"Sem nenhum motivo."},
     correta:"A", feedback:"Os rios ofereciam água para beber, peixes para comer e terras férteis nas margens, ótimas para a agricultura."},
    {id:17, conteudo_bncc:"A vida em torno do rio Nilo",
     pergunta:"Qual antiga civilização se desenvolveu às margens do rio Nilo?",
     opcoes:{A:"O Egito.",B:"O Brasil.",C:"O Japão.",D:"A Argentina."},
     correta:"A", feedback:"A civilização egípcia se desenvolveu às margens do rio Nilo, na África."},
    {id:18, conteudo_bncc:"A vida em torno do rio Nilo",
     pergunta:"Por que o rio Nilo era tão importante para o povo egípcio?",
     opcoes:{A:"Porque suas cheias deixavam a terra fértil para a agricultura.",B:"Porque secava a terra.",C:"Porque não servia para nada.",D:"Porque afastava os alimentos."},
     correta:"A", feedback:"As cheias do rio Nilo deixavam as terras das margens muito férteis, favorecendo a agricultura no Egito."},
    {id:19, conteudo_bncc:"O território brasileiro até 1500",
     pergunta:"Antes de 1500, como era o território brasileiro?",
     opcoes:{A:"Habitado apenas pelos povos indígenas, com muitas florestas.",B:"Cheio de cidades grandes.",C:"Com muitas fábricas.",D:"Totalmente vazio, sem ninguém."},
     correta:"A", feedback:"Antes de 1500, o território era habitado pelos povos indígenas e coberto por muitas florestas e matas."},
    {id:20, conteudo_bncc:"O território brasileiro até 1500",
     pergunta:"Em que ano os portugueses chegaram ao território que hoje é o Brasil?",
     opcoes:{A:"Em 1500.",B:"Em 1822.",C:"Em 1900.",D:"Em 2000."},
     correta:"A", feedback:"Os portugueses chegaram ao território brasileiro no ano de 1500."},
    {id:21, conteudo_bncc:"A exploração do pau-brasil",
     pergunta:"Qual foi o primeiro produto muito explorado pelos portugueses no Brasil?",
     opcoes:{A:"O pau-brasil.",B:"O petróleo.",C:"O ouro.",D:"O plástico."},
     correta:"A", feedback:"O pau-brasil foi o primeiro produto explorado, usado para tingir tecidos de vermelho na Europa."},
    {id:22, conteudo_bncc:"A exploração do pau-brasil",
     pergunta:"Quem cortava e carregava o pau-brasil para os portugueses no início da colonização?",
     opcoes:{A:"Os indígenas, em troca de objetos.",B:"Os robôs.",C:"Os europeus sozinhos.",D:"Ninguém."},
     correta:"A", feedback:"Os indígenas cortavam e transportavam o pau-brasil, recebendo objetos como espelhos e facas em troca."},
    {id:23, conteudo_bncc:"Cana-de-açúcar: a riqueza doce do Brasil",
     pergunta:"Depois do pau-brasil, qual cultivo se tornou muito importante na economia do Brasil colonial?",
     opcoes:{A:"A cana-de-açúcar.",B:"A batata.",C:"O trigo.",D:"O algodão."},
     correta:"A", feedback:"A cana-de-açúcar tornou-se muito importante, produzindo o açúcar, muito valorizado na Europa."},
    {id:24, conteudo_bncc:"Cana-de-açúcar: a riqueza doce do Brasil",
     pergunta:"Quem era obrigado a realizar o trabalho pesado nas plantações de cana-de-açúcar?",
     opcoes:{A:"Os povos indígenas e, principalmente, os africanos escravizados.",B:"Somente os donos das fazendas.",C:"As crianças da cidade.",D:"Os reis de Portugal."},
     correta:"A", feedback:"O trabalho forçado era feito por indígenas e, sobretudo, por africanos escravizados, trazidos à força para o Brasil."},
    {id:25, conteudo_bncc:"Café: o ouro verde do Brasil",
     pergunta:"Qual produto ficou conhecido como o 'ouro verde' do Brasil?",
     opcoes:{A:"O café.",B:"A alface.",C:"O milho.",D:"O feijão."},
     correta:"A", feedback:"O café foi chamado de 'ouro verde' por ter trazido muita riqueza ao Brasil, principalmente no século XIX."},
    {id:26, conteudo_bncc:"Café: o ouro verde do Brasil",
     pergunta:"Em qual região do Brasil o cultivo do café mais se desenvolveu?",
     opcoes:{A:"Na região Sudeste.",B:"Na região Norte.",C:"Na Antártida.",D:"No meio do oceano."},
     correta:"A", feedback:"O café se desenvolveu bastante na região Sudeste, em estados como São Paulo, Minas Gerais e Rio de Janeiro."},
    {id:27, conteudo_bncc:"O uso da terra no Brasil",
     pergunta:"Ao longo da história, como o uso da terra no Brasil foi mudando?",
     opcoes:{A:"De acordo com os produtos mais valorizados em cada época (pau-brasil, cana, café).",B:"Nunca mudou nada.",C:"Só serviu para construir cidades.",D:"Sempre foi igual desde 1500."},
     correta:"A", feedback:"O uso da terra mudou conforme os produtos de cada época: pau-brasil, depois cana-de-açúcar e, mais tarde, o café."},
    {id:28, conteudo_bncc:"A agricultura brasileira na atualidade",
     pergunta:"Como é feita grande parte da agricultura no Brasil atualmente?",
     opcoes:{A:"Com o uso de máquinas modernas, como tratores e colheitadeiras.",B:"Apenas com as mãos, sem ferramentas.",C:"Sem nenhuma tecnologia.",D:"Somente com animais."},
     correta:"A", feedback:"Hoje, boa parte da agricultura brasileira usa máquinas modernas, produzindo grandes quantidades de alimentos."},
    {id:29, conteudo_bncc:"A agricultura brasileira na atualidade",
     pergunta:"Qual é uma vantagem do uso de máquinas na agricultura atual?",
     opcoes:{A:"Produzir mais alimentos em menos tempo.",B:"Deixar a terra sem uso.",C:"Diminuir a produção de alimentos.",D:"Tornar o trabalho mais difícil."},
     correta:"A", feedback:"As máquinas permitem produzir grandes quantidades de alimentos em menos tempo e com menos esforço."},
    {id:30, conteudo_bncc:"Transformações da agricultura",
     pergunta:"Por que a descoberta da agricultura é considerada tão importante na História?",
     opcoes:{A:"Porque transformou o modo de vida dos humanos, tornando-os sedentários.",B:"Porque não mudou nada.",C:"Porque fez os humanos deixarem de comer.",D:"Porque acabou com as plantas."},
     correta:"A", feedback:"A agricultura transformou tudo: os humanos ficaram sedentários, formaram aldeias e mudaram seu modo de viver."}
  ],
  Geografia: [
    {id:1, conteudo_bncc:"Brasil: organização política",
     pergunta:"Como o território brasileiro está organizado politicamente?",
     opcoes:{A:"Em estados, municípios e o Distrito Federal.",B:"Apenas em bairros.",C:"Em fazendas e vilas.",D:"Em continentes."},
     correta:"A", feedback:"O Brasil é organizado politicamente em estados, municípios e o Distrito Federal, onde fica a capital, Brasília."},
    {id:2, conteudo_bncc:"Brasil: organização política",
     pergunta:"Quantos estados o Brasil possui atualmente?",
     opcoes:{A:"10 estados.",B:"15 estados.",C:"26 estados e o Distrito Federal.",D:"50 estados."},
     correta:"C", feedback:"O Brasil tem 26 estados e mais o Distrito Federal, onde está localizada a capital do país."},
    {id:3, conteudo_bncc:"Brasil: organização política",
     pergunta:"Qual é a capital do Brasil?",
     opcoes:{A:"São Paulo.",B:"Rio de Janeiro.",C:"Brasília.",D:"Salvador."},
     correta:"C", feedback:"Brasília, localizada no Distrito Federal, é a capital do Brasil desde 1960."},
    {id:4, conteudo_bncc:"Brasil: organização política",
     pergunta:"A menor divisão política do Brasil, onde moramos e existe uma prefeitura, é o:",
     opcoes:{A:"Município.",B:"Continente.",C:"Estado.",D:"País."},
     correta:"A", feedback:"O município é a menor divisão política. Cada município tem sua prefeitura e câmara de vereadores."},
    {id:5, conteudo_bncc:"Brasil: organização política",
     pergunta:"Cada estado brasileiro é governado por um(a):",
     opcoes:{A:"Prefeito.",B:"Governador(a).",C:"Diretor de escola.",D:"Presidente."},
     correta:"B", feedback:"Cada estado é administrado por um(a) governador(a), escolhido(a) pelo voto da população."},
    {id:6, conteudo_bncc:"Brasil: organização política",
     pergunta:"Quem governa um município é o(a):",
     opcoes:{A:"Presidente.",B:"Governador.",C:"Prefeito(a).",D:"Senador."},
     correta:"C", feedback:"O(a) prefeito(a) é quem administra o município, cuidando de serviços como escolas e ruas."},
    {id:7, conteudo_bncc:"Brasil: organização política",
     pergunta:"Quem é o(a) responsável por governar todo o país?",
     opcoes:{A:"O prefeito.",B:"O governador.",C:"O(a) presidente da República.",D:"O vereador."},
     correta:"C", feedback:"O(a) presidente da República governa todo o Brasil e é escolhido(a) pelo voto de toda a população."},
    {id:8, conteudo_bncc:"Os três poderes",
     pergunta:"Quais são os três poderes que organizam o governo do Brasil?",
     opcoes:{A:"Executivo, Legislativo e Judiciário.",B:"Escola, hospital e mercado.",C:"Norte, Sul e Leste.",D:"Prefeito, aluno e médico."},
     correta:"A", feedback:"Os três poderes são: Executivo (governa), Legislativo (faz as leis) e Judiciário (faz cumprir as leis)."},
    {id:9, conteudo_bncc:"Os três poderes",
     pergunta:"O poder responsável por CRIAR as leis é o:",
     opcoes:{A:"Executivo.",B:"Legislativo.",C:"Judiciário.",D:"Municipal."},
     correta:"B", feedback:"O poder Legislativo cria as leis. Fazem parte dele os vereadores, deputados e senadores."},
    {id:10, conteudo_bncc:"Os três poderes",
     pergunta:"O poder que GOVERNA e administra, como o presidente, governador e prefeito, é o:",
     opcoes:{A:"Executivo.",B:"Legislativo.",C:"Judiciário.",D:"Escolar."},
     correta:"A", feedback:"O poder Executivo governa e administra o país, o estado e o município (presidente, governador e prefeito)."},
    {id:11, conteudo_bncc:"Os três poderes",
     pergunta:"O poder que faz as leis serem cumpridas e resolve conflitos na Justiça é o:",
     opcoes:{A:"Executivo.",B:"Legislativo.",C:"Judiciário.",D:"Municipal."},
     correta:"C", feedback:"O poder Judiciário garante que as leis sejam cumpridas e julga os conflitos. Dele fazem parte os juízes."},
    {id:12, conteudo_bncc:"Órgãos públicos e cidadania",
     pergunta:"O que são órgãos públicos?",
     opcoes:{A:"Lugares que oferecem serviços à população, como escolas e hospitais.",B:"Lojas particulares.",C:"Casas de família.",D:"Fábricas de brinquedos."},
     correta:"A", feedback:"Órgãos públicos oferecem serviços à população, como escolas, hospitais e postos de saúde."},
    {id:13, conteudo_bncc:"Órgãos públicos e cidadania",
     pergunta:"Qual destes é um serviço público oferecido à população?",
     opcoes:{A:"Um shopping particular.",B:"Uma escola pública.",C:"Uma loja de roupas.",D:"Um restaurante."},
     correta:"B", feedback:"A escola pública é um serviço público, mantido pelo governo para atender toda a população."},
    {id:14, conteudo_bncc:"Participação do cidadão",
     pergunta:"Como o cidadão participa da escolha dos governantes do país?",
     opcoes:{A:"Por meio do voto.",B:"Escolhendo sozinho, sem regras.",C:"Não participa de nada.",D:"Somente na televisão."},
     correta:"A", feedback:"O cidadão participa por meio do voto, escolhendo prefeitos, governadores, presidente e outros representantes."},
    {id:15, conteudo_bncc:"Participação do cidadão",
     pergunta:"Qual destas é uma atitude de um bom cidadão?",
     opcoes:{A:"Jogar lixo no chão.",B:"Cuidar dos espaços públicos e respeitar as leis.",C:"Estragar as praças.",D:"Desrespeitar as regras."},
     correta:"B", feedback:"Um bom cidadão cuida dos espaços públicos, respeita as leis e colabora com a comunidade."},
    {id:16, conteudo_bncc:"Participação do cidadão",
     pergunta:"O que são os DEVERES de um cidadão?",
     opcoes:{A:"Obrigações, como respeitar as leis e cuidar do meio ambiente.",B:"Apenas coisas divertidas.",C:"Não fazer nada.",D:"Somente receber dinheiro."},
     correta:"A", feedback:"Deveres são obrigações do cidadão, como respeitar as leis, os outros e cuidar do ambiente."},
    {id:17, conteudo_bncc:"Regionalização do Brasil",
     pergunta:"Em quantas grandes regiões o Brasil é dividido?",
     opcoes:{A:"3 regiões.",B:"5 regiões.",C:"10 regiões.",D:"26 regiões."},
     correta:"B", feedback:"O Brasil é dividido em 5 regiões: Norte, Nordeste, Centro-Oeste, Sudeste e Sul."},
    {id:18, conteudo_bncc:"Regionalização do Brasil",
     pergunta:"Quais são as cinco regiões do Brasil?",
     opcoes:{A:"Norte, Nordeste, Centro-Oeste, Sudeste e Sul.",B:"Leste, Oeste, Alto, Baixo e Meio.",C:"Rio, São Paulo, Bahia, Sul e Norte.",D:"Cidade, Campo, Praia, Mata e Rio."},
     correta:"A", feedback:"As cinco regiões brasileiras são: Norte, Nordeste, Centro-Oeste, Sudeste e Sul."},
    {id:19, conteudo_bncc:"Regionalização do Brasil",
     pergunta:"Em qual região do Brasil fica a maior parte da Floresta Amazônica?",
     opcoes:{A:"Região Sul.",B:"Região Norte.",C:"Região Sudeste.",D:"Região Nordeste."},
     correta:"B", feedback:"A maior parte da Floresta Amazônica está na Região Norte do Brasil."},
    {id:20, conteudo_bncc:"Regionalização do Brasil",
     pergunta:"Por que o Brasil é dividido em regiões?",
     opcoes:{A:"Para facilitar o estudo e a organização do país.",B:"Para separar as pessoas.",C:"Sem nenhum motivo.",D:"Para diminuir o Brasil."},
     correta:"A", feedback:"A divisão em regiões ajuda a estudar e organizar o país, agrupando áreas com características parecidas."},
    {id:21, conteudo_bncc:"Interdependência entre os espaços",
     pergunta:"O que significa dizer que o campo e a cidade são interdependentes?",
     opcoes:{A:"Que não têm nenhuma ligação.",B:"Que um depende do outro e trocam produtos e serviços.",C:"Que são exatamente iguais.",D:"Que ficam no mesmo lugar."},
     correta:"B", feedback:"Interdependência significa que campo e cidade dependem um do outro, trocando produtos e serviços."},
    {id:22, conteudo_bncc:"Interdependência entre os espaços",
     pergunta:"O que o CAMPO (área rural) geralmente envia para a cidade?",
     opcoes:{A:"Prédios.",B:"Alimentos e matérias-primas.",C:"Semáforos.",D:"Ônibus."},
     correta:"B", feedback:"O campo produz e envia alimentos (frutas, verduras, carne) e matérias-primas para as cidades."},
    {id:23, conteudo_bncc:"Interdependência entre os espaços",
     pergunta:"O que a CIDADE (área urbana) costuma oferecer ao campo?",
     opcoes:{A:"Apenas terra.",B:"Máquinas, remédios e produtos industrializados.",C:"Somente animais.",D:"Nada."},
     correta:"B", feedback:"A cidade oferece ao campo produtos industrializados, máquinas, remédios e serviços como hospitais e escolas."},
    {id:24, conteudo_bncc:"Produção, circulação e consumo",
     pergunta:"Quando uma fábrica FABRICA um tênis, isso é um exemplo de:",
     opcoes:{A:"Produção.",B:"Consumo.",C:"Circulação.",D:"Descarte."},
     correta:"A", feedback:"Produção é a etapa em que o produto é fabricado, como o tênis feito na fábrica."},
    {id:25, conteudo_bncc:"Produção, circulação e consumo",
     pergunta:"Quando um caminhão LEVA os produtos da fábrica até as lojas, isso é a etapa de:",
     opcoes:{A:"Produção.",B:"Circulação (transporte).",C:"Consumo.",D:"Plantio."},
     correta:"B", feedback:"A circulação é o transporte dos produtos, levando-os da fábrica até as lojas e mercados."},
    {id:26, conteudo_bncc:"Produção, circulação e consumo",
     pergunta:"Quando uma pessoa COMPRA e usa o tênis, isso é um exemplo de:",
     opcoes:{A:"Produção.",B:"Circulação.",C:"Consumo.",D:"Fabricação."},
     correta:"C", feedback:"O consumo é quando as pessoas compram e usam os produtos, como comprar e usar o tênis."},
    {id:27, conteudo_bncc:"O trabalho e os setores da economia",
     pergunta:"O setor da economia ligado à agricultura, pecuária e extração de recursos da natureza é o:",
     opcoes:{A:"Setor primário.",B:"Setor secundário.",C:"Setor terciário.",D:"Setor escolar."},
     correta:"A", feedback:"O setor primário é ligado à natureza: agricultura, pecuária, pesca e extração de recursos."},
    {id:28, conteudo_bncc:"O trabalho e os setores da economia",
     pergunta:"O setor da economia que transforma matérias-primas em produtos, nas fábricas e indústrias, é o:",
     opcoes:{A:"Setor primário.",B:"Setor secundário.",C:"Setor terciário.",D:"Setor rural."},
     correta:"B", feedback:"O setor secundário transforma matérias-primas em produtos nas indústrias e fábricas."},
    {id:29, conteudo_bncc:"O trabalho e os setores da economia",
     pergunta:"O setor da economia ligado ao comércio e aos serviços, como lojas, escolas e hospitais, é o:",
     opcoes:{A:"Setor primário.",B:"Setor secundário.",C:"Setor terciário.",D:"Setor natural."},
     correta:"C", feedback:"O setor terciário é o do comércio e dos serviços, como lojas, hospitais, escolas e transportes."},
    {id:30, conteudo_bncc:"O trabalho e os setores da economia",
     pergunta:"Um agricultor que planta arroz trabalha em qual setor da economia?",
     opcoes:{A:"Setor primário.",B:"Setor secundário.",C:"Setor terciário.",D:"Nenhum setor."},
     correta:"A", feedback:"O agricultor trabalha no setor primário, pois produz alimentos direto da natureza (agricultura)."}
  ],
  Ciencias: [
    {id:1, conteudo_bncc:"Seres vivos e suas inter-relações",
     pergunta:"O que são seres vivos?",
     opcoes:{A:"Coisas que nascem, crescem, se reproduzem e morrem.",B:"Apenas as pedras.",C:"Somente a água e o ar.",D:"Objetos feitos pelo homem."},
     correta:"A", feedback:"Seres vivos são aqueles que nascem, crescem, se alimentam, se reproduzem e morrem, como plantas e animais."},
    {id:2, conteudo_bncc:"Seres vivos e suas inter-relações",
     pergunta:"O que significa dizer que os seres vivos têm 'inter-relações'?",
     opcoes:{A:"Que vivem sozinhos e isolados.",B:"Que se relacionam e dependem uns dos outros.",C:"Que nunca se encontram.",D:"Que são todos iguais."},
     correta:"B", feedback:"Inter-relações significam que os seres vivos se relacionam e dependem uns dos outros para viver."},
    {id:3, conteudo_bncc:"Cadeia alimentar - produtores",
     pergunta:"Na cadeia alimentar, as plantas são chamadas de PRODUTORES porque:",
     opcoes:{A:"Comem outros animais.",B:"Produzem seu próprio alimento pela luz do sol.",C:"Não precisam de nada.",D:"Vivem embaixo da terra."},
     correta:"B", feedback:"As plantas são produtoras porque fabricam seu próprio alimento usando a luz do sol (fotossíntese)."},
    {id:4, conteudo_bncc:"Cadeia alimentar - consumidores",
     pergunta:"Os animais que se alimentam de outros seres vivos são chamados de:",
     opcoes:{A:"Produtores.",B:"Consumidores.",C:"Decompositores.",D:"Plantas."},
     correta:"B", feedback:"Os animais são consumidores, pois precisam se alimentar de plantas ou de outros animais para viver."},
    {id:5, conteudo_bncc:"Cadeia alimentar - herbívoros",
     pergunta:"Um animal que come SOMENTE plantas é chamado de:",
     opcoes:{A:"Carnívoro.",B:"Herbívoro.",C:"Onívoro.",D:"Produtor."},
     correta:"B", feedback:"Herbívoros são animais que se alimentam apenas de plantas, como a vaca e o coelho."},
    {id:6, conteudo_bncc:"Cadeia alimentar - carnívoros",
     pergunta:"Um animal que se alimenta de outros animais é chamado de:",
     opcoes:{A:"Herbívoro.",B:"Carnívoro.",C:"Produtor.",D:"Decompositor."},
     correta:"B", feedback:"Carnívoros são animais que comem outros animais, como o leão e a onça."},
    {id:7, conteudo_bncc:"Cadeia alimentar - onívoros",
     pergunta:"Um animal que come tanto plantas quanto outros animais é chamado de:",
     opcoes:{A:"Herbívoro.",B:"Carnívoro.",C:"Onívoro.",D:"Produtor."},
     correta:"C", feedback:"Onívoros comem plantas e animais. O ser humano e o porco são exemplos de onívoros."},
    {id:8, conteudo_bncc:"Cadeia alimentar - decompositores",
     pergunta:"Os seres que decompõem restos de plantas e animais mortos são chamados de:",
     opcoes:{A:"Produtores.",B:"Consumidores.",C:"Decompositores.",D:"Herbívoros."},
     correta:"C", feedback:"Os decompositores, como fungos e bactérias, transformam restos de seres mortos, devolvendo nutrientes ao solo."},
    {id:9, conteudo_bncc:"Cadeia alimentar",
     pergunta:"Observe a cadeia: capim → gafanhoto → sapo → cobra. Quem é o PRODUTOR?",
     opcoes:{A:"O capim.",B:"O gafanhoto.",C:"O sapo.",D:"A cobra."},
     correta:"A", feedback:"O capim é o produtor, pois é uma planta que fabrica seu próprio alimento e inicia a cadeia."},
    {id:10, conteudo_bncc:"Cadeia alimentar",
     pergunta:"Na cadeia: capim → gafanhoto → sapo → cobra. O que o gafanhoto come?",
     opcoes:{A:"O sapo.",B:"O capim.",C:"A cobra.",D:"Outro gafanhoto."},
     correta:"B", feedback:"O gafanhoto come o capim. Por isso ele é o primeiro consumidor da cadeia (herbívoro)."},
    {id:11, conteudo_bncc:"Cadeia alimentar",
     pergunta:"O que a seta (→) indica em uma cadeia alimentar?",
     opcoes:{A:"O sentido de quem serve de alimento para quem.",B:"O caminho de uma estrada.",C:"A direção do vento.",D:"Nada de importante."},
     correta:"A", feedback:"A seta indica 'serve de alimento para', mostrando para onde vai a energia dos alimentos na cadeia."},
    {id:12, conteudo_bncc:"Teia alimentar",
     pergunta:"O que é uma TEIA alimentar?",
     opcoes:{A:"Uma única cadeia isolada.",B:"O conjunto de várias cadeias alimentares interligadas.",C:"Uma teia de aranha.",D:"Um tipo de planta."},
     correta:"B", feedback:"A teia alimentar é formada por várias cadeias alimentares interligadas, mostrando como tudo se conecta na natureza."},
    {id:13, conteudo_bncc:"Cadeia alimentar",
     pergunta:"Na cadeia: alface → coelho → raposa. Qual animal é o carnívoro?",
     opcoes:{A:"A alface.",B:"O coelho.",C:"A raposa.",D:"Nenhum deles."},
     correta:"C", feedback:"A raposa é carnívora, pois se alimenta do coelho. Já o coelho é herbívoro (come a alface)."},
    {id:14, conteudo_bncc:"Características da biosfera",
     pergunta:"O que é a BIOSFERA?",
     opcoes:{A:"A parte do planeta onde existe vida.",B:"Somente o céu.",C:"Apenas o fundo do mar.",D:"Uma cidade grande."},
     correta:"A", feedback:"A biosfera é a parte da Terra onde há vida: o solo, a água e o ar onde vivem os seres vivos."},
    {id:15, conteudo_bncc:"Características da biosfera",
     pergunta:"Quais elementos são essenciais para a vida existir na biosfera?",
     opcoes:{A:"Água, ar, luz do sol e solo.",B:"Apenas pedras.",C:"Somente plástico.",D:"Nada é necessário."},
     correta:"A", feedback:"A vida na biosfera depende de água, ar, luz do sol e solo, que garantem a sobrevivência dos seres vivos."},
    {id:16, conteudo_bncc:"Características da biosfera",
     pergunta:"O lugar onde um ser vivo vive, com tudo o que ele precisa, é chamado de:",
     opcoes:{A:"Habitat.",B:"Cidade.",C:"Escola.",D:"Loja."},
     correta:"A", feedback:"O habitat é o lugar onde o ser vivo encontra alimento, água e abrigo para viver."},
    {id:17, conteudo_bncc:"Características da biosfera",
     pergunta:"O conjunto formado pelos seres vivos e o ambiente onde vivem é chamado de:",
     opcoes:{A:"Ecossistema.",B:"Supermercado.",C:"Rodovia.",D:"Fábrica."},
     correta:"A", feedback:"Ecossistema é o conjunto dos seres vivos e o ambiente (água, solo, ar) em que se relacionam."},
    {id:18, conteudo_bncc:"Relações ecológicas harmônicas",
     pergunta:"O que são relações ecológicas HARMÔNICAS?",
     opcoes:{A:"Relações em que os seres vivos se ajudam ou não se prejudicam.",B:"Relações em que todos brigam.",C:"Relações que não existem.",D:"Relações só entre plantas."},
     correta:"A", feedback:"Nas relações harmônicas, os seres vivos se ajudam ou pelo menos não se prejudicam."},
    {id:19, conteudo_bncc:"Relações ecológicas harmônicas",
     pergunta:"A abelha se alimenta do néctar da flor e, ao mesmo tempo, ajuda na polinização. Essa relação é:",
     opcoes:{A:"Harmônica (os dois se beneficiam).",B:"Desarmônica (um prejudica o outro).",C:"Impossível.",D:"Prejudicial para os dois."},
     correta:"A", feedback:"É uma relação harmônica: a abelha ganha alimento e a flor é polinizada. Os dois se beneficiam."},
    {id:20, conteudo_bncc:"Relações ecológicas harmônicas",
     pergunta:"Formigas que vivem juntas, dividindo tarefas no formigueiro, são um exemplo de:",
     opcoes:{A:"Vida em sociedade (relação harmônica).",B:"Predação.",C:"Competição.",D:"Parasitismo."},
     correta:"A", feedback:"As formigas vivem em sociedade, dividindo tarefas. É uma relação harmônica entre seres da mesma espécie."},
    {id:21, conteudo_bncc:"Relações desarmônicas - predação",
     pergunta:"Quando a onça caça e come o veado, temos uma relação de:",
     opcoes:{A:"Predação.",B:"Amizade.",C:"Cooperação.",D:"Polinização."},
     correta:"A", feedback:"A predação ocorre quando um animal (predador) caça e come outro (presa). A onça é o predador."},
    {id:22, conteudo_bncc:"Relações desarmônicas - parasitismo",
     pergunta:"O carrapato vive no corpo do cachorro e suga seu sangue, prejudicando-o. Essa relação é:",
     opcoes:{A:"Parasitismo.",B:"Harmônica.",C:"Cooperação.",D:"Predação."},
     correta:"A", feedback:"É parasitismo: o carrapato (parasita) se beneficia e prejudica o cachorro (hospedeiro)."},
    {id:23, conteudo_bncc:"Relações desarmônicas - competição",
     pergunta:"Dois leões disputando o mesmo alimento é um exemplo de:",
     opcoes:{A:"Competição.",B:"Amizade.",C:"Polinização.",D:"Sociedade."},
     correta:"A", feedback:"A competição acontece quando seres vivos disputam o mesmo recurso, como alimento, água ou espaço."},
    {id:24, conteudo_bncc:"Relações desarmônicas",
     pergunta:"O que são relações ecológicas DESARMÔNICAS?",
     opcoes:{A:"Relações em que pelo menos um ser é prejudicado.",B:"Relações em que todos se ajudam.",C:"Relações que não existem.",D:"Relações só entre plantas."},
     correta:"A", feedback:"Nas relações desarmônicas, pelo menos um dos seres envolvidos é prejudicado, como na predação e no parasitismo."},
    {id:25, conteudo_bncc:"Fluxo de energia",
     pergunta:"De onde vem a energia que dá início a toda cadeia alimentar?",
     opcoes:{A:"Da luz do Sol.",B:"Da lua.",C:"Do vento.",D:"Das pedras."},
     correta:"A", feedback:"A energia vem da luz do Sol, que as plantas usam para produzir alimento, iniciando o fluxo de energia."},
    {id:26, conteudo_bncc:"Fluxo de energia",
     pergunta:"Na cadeia alimentar, em qual sentido a energia passa?",
     opcoes:{A:"Do produtor para os consumidores, seguindo as setas.",B:"Dos consumidores para o Sol.",C:"Não passa energia nenhuma.",D:"Sempre para trás."},
     correta:"A", feedback:"A energia flui do produtor (planta) para os consumidores, sempre no sentido das setas da cadeia."},
    {id:27, conteudo_bncc:"Fluxo de energia",
     pergunta:"Ao passar de um ser vivo para outro na cadeia, a quantidade de energia disponível:",
     opcoes:{A:"Vai diminuindo a cada nível.",B:"Aumenta sem parar.",C:"Fica sempre igual.",D:"Some totalmente logo no início."},
     correta:"A", feedback:"A cada nível da cadeia, parte da energia é usada e se perde, então sobra menos energia para o próximo ser."},
    {id:28, conteudo_bncc:"Ciclo da matéria",
     pergunta:"O que acontece com a matéria dos seres vivos quando eles morrem?",
     opcoes:{A:"É decomposta e volta para a natureza, sendo reaproveitada.",B:"Desaparece para sempre.",C:"Vira energia solar.",D:"Não muda nada."},
     correta:"A", feedback:"A matéria é decomposta e volta ao solo, sendo reaproveitada pelas plantas. É o ciclo da matéria na natureza."},
    {id:29, conteudo_bncc:"Ciclo da matéria",
     pergunta:"Qual é o papel dos decompositores no ciclo da matéria?",
     opcoes:{A:"Transformar restos de seres mortos em nutrientes para o solo.",B:"Produzir luz do sol.",C:"Caçar animais grandes.",D:"Voar pelo céu."},
     correta:"A", feedback:"Os decompositores devolvem os nutrientes ao solo, permitindo que a matéria seja reutilizada pelas plantas."},
    {id:30, conteudo_bncc:"Fluxo de energia e ciclo da matéria",
     pergunta:"Qual é a diferença entre o fluxo de energia e o ciclo da matéria?",
     opcoes:{A:"A energia flui em um sentido e se perde; a matéria é reaproveitada em ciclo.",B:"São exatamente a mesma coisa.",C:"Nenhum dos dois existe.",D:"A matéria some e a energia fica parada."},
     correta:"A", feedback:"A energia flui em um único sentido e vai se perdendo; já a matéria circula e é reaproveitada em ciclo."}
  ],
  EducacaoFisica: [
    {id:1, conteudo_bncc:"Lutas: diferença entre luta e briga",
     pergunta:"Qual é a principal diferença entre uma LUTA e uma BRIGA?",
     opcoes:{A:"A luta tem regras e respeito; a briga não tem regras.",B:"Não existe diferença.",C:"A briga é um esporte oficial.",D:"A luta é sempre violenta."},
     correta:"A", feedback:"A luta é um esporte com regras, técnicas e respeito. A briga não tem regras e é motivada por raiva."},
    {id:2, conteudo_bncc:"Lutas: características da luta",
     pergunta:"Qual é o objetivo de uma LUTA como esporte?",
     opcoes:{A:"Superar o oponente com estratégia e habilidade técnica.",B:"Machucar o outro por ódio.",C:"Brigar na rua.",D:"Fugir do adversário."},
     correta:"A", feedback:"Na luta, o objetivo é superar o oponente usando estratégia e técnica, e não por ódio."},
    {id:3, conteudo_bncc:"Lutas: ambiente seguro",
     pergunta:"Onde as lutas devem ser praticadas?",
     opcoes:{A:"Em locais seguros, como tatames ou ringues, com árbitros.",B:"Em ruas e corredores.",C:"Em qualquer lugar perigoso.",D:"Sem nenhuma supervisão."},
     correta:"A", feedback:"As lutas são praticadas em locais seguros, como tatames e ringues, com proteção e supervisão de árbitros."},
    {id:4, conteudo_bncc:"Lutas: mentalidade",
     pergunta:"O que uma luta, como esporte, ensina para quem a pratica?",
     opcoes:{A:"Disciplina, autocontrole e respeito mútuo.",B:"Descontrole e violência.",C:"A não respeitar ninguém.",D:"A brigar sempre."},
     correta:"A", feedback:"A luta ensina disciplina, autocontrole e respeito. O lema é que o adversário não é um inimigo."},

const MATERIAS = {
  Historia:       {nome:"História",          icone:"📜"},
  Geografia:      {nome:"Geografia",         icone:"🗺️"},
  Ciencias:       {nome:"Ciências",          icone:"🔬"},
  EducacaoFisica: {nome:"Educação Física",   icone:"⚽"},
  Ingles:         {nome:"Língua Inglesa",    icone:"🇬🇧"},
  Matematica:     {nome:"Matemática",        icone:"🔢"},
  Portugues:      {nome:"Língua Portuguesa", icone:"📖"}
};

/* ===================== ESTADO ===================== */
let materiaAtual = "", questoesAtuais = [], respostas = {};
let tempoInicio = 0, cronoInterval = null, tempoGasto = 0;

/* ===================== NAVEGAÇÃO ===================== */
function mostrar(tela){
  ["telaInicio","telaProva","telaResultado","telaHistorico","telaMedalhas"]
    .forEach(t=>document.getElementById(t).classList.add("hide"));
  document.getElementById(tela).classList.remove("hide");
  window.scrollTo(0,0);
}
function voltarInicio(){ clearInterval(cronoInterval); mostrar("telaInicio"); }

/* ===================== PROVA ===================== */
function embaralhar(arr){ return arr.slice().sort(()=>Math.random()-0.5); }

function comecarProva(){
  materiaAtual = document.getElementById("selMateria").value;
  questoesAtuais = embaralhar(BANCO[materiaAtual]).slice(0,12);
  respostas = {};
  renderProva();
  mostrar("telaProva");
}
function refazerProva(){ comecarProva(); }

function renderProva(){
  const icones = { Historia:"📜", Geografia:"🗺️", Ciencias:"🔬", EducacaoFisica:"⚽", Ingles:"🇬🇧", Matematica:"🔢", Portugues:"📖" };
  document.getElementById("tituloProva").innerText =
    (icones[materiaAtual]||"📘") + " Simulado de " + MATERIAS[materiaAtual].nome;
  const cont = document.getElementById("questoes");
  cont.innerHTML = "";
  questoesAtuais.forEach((q,i)=>{
    let opc = "";
    for(let l in q.opcoes){
      opc += `<button class="opcao" data-q="${i}" data-l="${l}" onclick="selecionar(${i},'${l}')">
        <span class="letra">${l}</span>${q.opcoes[l]}</button>`;
    }
    let ilustra = q.imagem ? `<div class="ilustra">${q.imagem}</div>` : "";
    cont.innerHTML += `<div class="card">
      <p><b>Questão ${i+1}.</b> ${q.pergunta}</p>${ilustra}${opc}</div>`;
  });
  atualizarProgresso();
  iniciarCronometro();
}

function selecionar(i,l){
  respostas[i]=l;
  document.querySelectorAll(`.opcao[data-q="${i}"]`).forEach(b=>{
    b.classList.toggle("sel", b.dataset.l===l);
  });
  atualizarProgresso();
}
function atualizarProgresso(){
  let feitas = Object.keys(respostas).length;
  let total = questoesAtuais.length;
  document.getElementById("barraProg").style.width = (feitas/total*100)+"%";
  document.getElementById("contador").innerText = `${feitas} de ${total} respondidas`;
}

function enviarProva(){
  if(Object.keys(respostas).length < questoesAtuais.length){
    if(!confirm("Você ainda não respondeu todas as questões. Deseja enviar mesmo assim?")) return;
  }
  let tempo = pararCronometro();
  let acertos = 0;
  questoesAtuais.forEach((q,i)=>{ if(respostas[i]===q.resposta_correta) acertos++; });
  let nota = (acertos/questoesAtuais.length*10).toFixed(1);
  salvarHistorico(acertos, nota, respostas, tempo);
  mostrarResultado(acertos, nota, respostas, tempo);
}

/* ===================== CRONÔMETRO ===================== */
function iniciarCronometro(){
  tempoInicio = Date.now();
  clearInterval(cronoInterval);
  cronoInterval = setInterval(atualizarCronometro, 1000);
  atualizarCronometro();
}
function atualizarCronometro(){
  let s = Math.floor((Date.now()-tempoInicio)/1000);
  let m = String(Math.floor(s/60)).padStart(2,"0");
  document.getElementById("cronometro").innerText = `⏱️ ${m}:${String(s%60).padStart(2,"0")}`;
}
function pararCronometro(){
  clearInterval(cronoInterval);
  tempoGasto = Math.floor((Date.now()-tempoInicio)/1000);
  return tempoGasto;
}
function formatarTempo(s){
  let m = String(Math.floor(s/60)).padStart(2,"0");
  return `${m}:${String(s%60).padStart(2,"0")}`;
}

/* ===================== RESULTADO ===================== */
function mostrarResultado(acertos, nota, resp, tempo){
  let est = nota>=8 ? "⭐⭐⭐" : nota>=6 ? "⭐⭐" : nota>=4 ? "⭐" : "😟";
  document.getElementById("estrelas").innerText = est;
  document.getElementById("msgNota").innerText =
    nota>=6 ? "Parabéns! 🎉" : "Continue estudando! 💪";
  document.getElementById("detalheNota").innerText =
    `Você acertou ${acertos} de ${questoesAtuais.length} • Nota: ${nota} • ⏱️ Tempo: ${formatarTempo(tempo)}`;
  mostrar("telaResultado");
}

function verGabarito(){
  const cont = document.getElementById("questoes");
  cont.innerHTML = "";

  questoesAtuais.forEach((q, i) => {
    let ilustra = q.imagem ? `<div class="ilustra">${q.imagem}</div>` : "";
    let opc = "";
    for (let l in q.opcoes){
      let cls = "opcao";
      if (l === q.resposta_correta) cls += " certa";
      else if (respostas[i] === l) cls += " errada";
      opc += `<button class="${cls}" disabled><span class="letra">${l}</span>${q.opcoes[l]}</button>`;
    }
    cont.innerHTML += `<div class="card">
      <p><b>Questão ${i+1}.</b> ${q.pergunta}</p>${ilustra}${opc}
      <div class="feedback">💡 <b>Explicação:</b> ${q.feedback}</div></div>`;
  });

  document.getElementById("tituloProva").innerText = "🔍 Gabarito — " + MATERIAS[materiaAtual].nome;
  document.querySelector("#telaProva .progress").parentElement.parentElement.querySelector(".progress").style.display = "none";
  document.getElementById("cronometro").style.display = "none";
  document.getElementById("contador").style.display = "none";
  document.querySelector('#telaProva .btn-roxo').style.display = "none";
  mostrar("telaProva");
}

/* ===================== HISTÓRICO ===================== */
function salvarHistorico(acertos, nota, resp, tempo){
  let hist = JSON.parse(localStorage.getItem("historico")||"[]");
  hist.unshift({
    materia: materiaAtual,
    data: new Date().toLocaleString("pt-BR"),
    acertos, total: questoesAtuais.length, nota, tempo: tempo||0
  });
  localStorage.setItem("historico", JSON.stringify(hist));
}

function verHistorico(){
  let hist = JSON.parse(localStorage.getItem("historico")||"[]");
  const div = document.getElementById("listaHistorico");
  div.innerHTML = "";
  if(hist.length===0){ div.innerHTML="<p>Você ainda não fez nenhum simulado. 📝</p>"; }
  else {
    for(let mat in MATERIAS){
      let itens = hist.filter(h=>h.materia===mat);
      if(itens.length===0) continue;
      let media = (itens.reduce((s,h)=>s+parseFloat(h.nota),0)/itens.length).toFixed(1);
      div.innerHTML += `<h3>${MATERIAS[mat].icone} ${MATERIAS[mat].nome} <small>(média ${media})</small></h3>`;
      itens.forEach(h=>{
        div.innerHTML += `<div class="hist-item">
          <span>${h.data}</span>
          <span><b>Nota ${h.nota}</b> (${h.acertos}/${h.total}) • ⏱️ ${formatarTempo(h.tempo||0)}</span>
        </div>`;
      });
    }
  }
  mostrar("telaHistorico");
}
function limparHistorico(){
  if(confirm("Tem certeza que deseja apagar todo o histórico?")){
    localStorage.removeItem("historico");
    verHistorico();
  }
}

/* ===================== MEDALHAS ===================== */
function nivelMedalha(nota){
  if(nota>=10) return {emoji:"🥇", nome:"Ouro"};
  if(nota>=8)  return {emoji:"🥈", nome:"Prata"};
  if(nota>=6)  return {emoji:"🥉", nome:"Bronze"};
  return null;
}
function verMedalhas(){
  let hist = JSON.parse(localStorage.getItem("historico")||"[]");
  const div = document.getElementById("listaMedalhas");
  div.innerHTML = "";
  for(let mat in MATERIAS){
    let notas = hist.filter(h=>h.materia===mat).map(h=>parseFloat(h.nota));
    let melhor = notas.length ? Math.max(...notas) : 0;
    let med = nivelMedalha(melhor);
    let bloq = med ? "" : "bloqueada";
    let icone = med ? med.emoji : "🔒";
    let texto = med
      ? `Medalha de ${med.nome} • melhor nota: ${melhor.toFixed(1)}`
      : "Faça um simulado e tire nota 6 ou mais para conquistar!";
    div.innerHTML += `<div class="medalha ${bloq}">
      <div class="icone">${icone}</div>
      <div class="info">
        <h3>${MATERIAS[mat].icone} ${MATERIAS[mat].nome}</h3>
        <small>${texto}</small>
      </div></div>`;
  }
  mostrar("telaMedalhas");
}
